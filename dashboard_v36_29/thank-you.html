<!DOCTYPE html>
<html lang="en" data-theme="auto">
<head>
  <title>Thank you – SchedMate</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
  <link rel="icon" type="image/svg+xml" href="assets/schedmate_icon.svg">

</head>
<body>
<header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="#"><img src="assets/schedmate_logo.svg" alt="SchedMate logo" class="brand-logo"/><span class="brand-name">SchedMate</span></a>
      <nav class="nav">
        <a href="#features">Features</a>
        <a href="#pricing">Pricing</a>
        <a href="login.html">Log in</a>
        <a href="signup.html" class="nav-cta">Sign up</a>
      </nav>
      <div class="theme-toggle">
        <span class="label"><span class="sun">☀️</span> Light</span>
        <label class="switch"><input type="checkbox" id="themeSwitch"><span class="slider"></span></label>
        <span class="label"><span class="moon">🌙</span> Dark</span>
      </div>
      <button class="hamburger" aria-label="Toggle menu"><span></span><span></span><span></span></button>
    </div>
  </header>

<main class="auth-page">
  <div class="auth-card">
    <h1>🎉 Thank you for signing up!</h1>
    <p>Start Free for 7 Days</p>
    <p class="muted">You can now access your dashboard and start creating jobs, clients, and reminders.</p>

    <a href="app/dashboard.html" class="btn btn-primary" style="margin-top:12px;display:block;text-align:center;">
      Go to Dashboard
    </a>

    <p class="auth-meta" style="margin-top:12px;">
      Having trouble? <a href="login.html">Log in again</a>
    </p>
  </div>
</main>

<script>
    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    const root = document.documentElement;
    const checkbox = document.getElementById('themeSwitch');
    const saved = localStorage.getItem('schedmate-theme');

    function applyTheme(mode){
      root.setAttribute('data-theme', mode);
      checkbox.checked = (mode === 'dark');
      localStorage.setItem('schedmate-theme', mode);
    }

    applyTheme(saved ? saved : (prefersDark ? 'dark' : 'light'));

    checkbox.addEventListener('change', () => {
      applyTheme(checkbox.checked ? 'dark' : 'light');
    });

</script>

</body>
</html>
